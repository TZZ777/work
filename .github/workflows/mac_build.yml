name: Build for MacOS
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller chardet Pillow

      - name: Build for Intel and Apple Silicon
        run: |
          pyinstaller --onefile --windowed --target-arch universal2 rename.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacOS_Universal_Executable
          path: dist/rename