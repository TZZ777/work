name: Build MacOS App
on: 
  push:
    branches:
      - main  # 或者改为你代码提交的主分支名
  workflow_dispatch: # 允许手动触发构建

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller Pillow  # 移除非必要依赖，减少体积

      - name: Build MacOS App Bundle
        run: |
          # 使用 PyInstaller 生成 .app
          # --windowed: 无控制台窗口
          # --noconfirm: 覆盖现有输出
          # --target-arch universal2: 支持 Intel 和 M1/M2 芯片
          pyinstaller --windowed \
                      --noconfirm \
                      --target-arch universal2 \
                      --name "RenameTool" \
                      renameZIP.py
          
          # 关键步骤：使用 macOS 原生 ditto 工具压缩
          # 相比普通 zip，ditto 能完美保留 Unix 权限位（+x）和 .app 内部结构
          cd dist
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "RenameTool.app" "RenameToolMac.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenameToolMacOSReady
          path: dist/RenameToolMac.zip
          retention-days: 5